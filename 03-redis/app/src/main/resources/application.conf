httpServer {
    port = 8080
    port = ${?HTTP_PORT}
    system.port = 8085
    system.port = ${?SYSTEM_PORT}
    telemetry.metrics.enabled = true
}

lettuce {
    uri = "redis://localhost:6379"
    uri = ${?REDIS_URL}
}

resilient {
    telemetry.rateLimiter.metrics.enabled = true
    ratelimiter.global {
        limitForPeriod = 300
        limitForPeriod = ${?GLOBAL_LIMIT_FOR_PERIOD}
        limitRefreshPeriod = "1s"
        limitRefreshPeriod = ${?GLOBAL_LIMIT_REFRESH_PERIOD}
        keyPrefix = "rate-limit-api"
        keyPrefix = ${?RATELIMIT_GLOBAL_KEY_PREFIX}
        algorithm = TOKEN_BUCKET
    }
}


ratelimit {
    ttl = "60s"
    ttl = ${?RATELIMIT_TTL}

    clients {
        free {
            rate = 10.0
            rate = ${?RATELIMIT_FREE_RATE}
            capacity = 20
            capacity = ${?RATELIMIT_FREE_CAPACITY}
            apiKey = "free-key"
            apiKey = ${?API_KEY_FREE}
        }
        standard {
            rate = 50.0
            rate = ${?RATELIMIT_STANDARD_RATE}
            capacity = 100
            capacity = ${?RATELIMIT_STANDARD_CAPACITY}
            apiKey = "standard-key"
            apiKey = ${?API_KEY_STANDARD}
        }
    }
}

metrics.enabled = true

logging.levels {
    "root": "INFO"
    "root": ${?LOGGING_LEVEL_ROOT}

    "io.koraframework": "INFO"
    "io.koraframework": ${?LOGGING_LEVEL_KORA}

    "dev.mikhail.ratelimit": "INFO"
    "dev.mikhail.ratelimit": ${?LOGGING_LEVEL_APP}
}
