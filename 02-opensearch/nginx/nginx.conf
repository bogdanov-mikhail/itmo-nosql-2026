# Конфигурация nginx стенда ЛР-2: учебная страница кофейни и access-лог
# в JSON — единственный источник логов для пайплайна.
# Формат JSON access-лога — в http-контексте (conf.d включается внутрь http).
log_format logjson escape=json
    '{"@timestamp":"$time_iso8601",'
    '"client":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"ua":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log logjson;

    location / {
        try_files $uri $uri/ =404;
    }
}
