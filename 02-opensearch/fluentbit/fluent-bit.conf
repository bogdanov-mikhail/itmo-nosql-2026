# Fluent Bit: читает JSON access-логи nginx и отправляет в data stream logs.
# Ключевые решения:
#  - Write_Operation create + Generate_ID Off: fluent bit сам не генерит _id,
#    OpenSearch создаёт документ без конфликтов 409 (Generate_ID On с create
#    тихо терял логи у одногруппников — см. разбор корпуса);
#  - DB: позиция tail-плагина переживает перезапуск контейнера;
#  - Retry_Limit ограничивает число попыток при недоступности кластера.
[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name            tail
    Path            /var/log/nginx/access.log
    Parser          nginx_json
    DB              /var/lib/fluent-bit/db.sqlite
    Refresh_Interval 1
    Skip_Long_Lines On

[OUTPUT]
    Name               opensearch
    Match              *
    Host               os-hot
    Port               9200
    Index              logs
    TLS                On
    TLS.Verify         On
    TLS.CA_FILE        /fluent-bit/etc/pki/root-ca.crt
    HTTP_User          logshipper
    HTTP_Passwd        ${LOGSHIPPER_PASSWORD}
    Suppress_Type_Name On
    Write_Operation    create
    Generate_ID        Off
    Retry_Limit        5
