---
# Демо 2.6: жизненный цикл временных роли и пользователя (создание → проверка → удаление)
- block:
    - name: Создание временной роли trialRole (find на spa.services)
      community.mongodb.mongodb_role:
        name: trialRole
        db: spa
        privileges:
          - resource: { db: spa, collection: services }
            actions: [find]
        state: present

    - name: Создание временного пользователя trialUser
      community.mongodb.mongodb_user:
        name: trialUser
        password: "{{ pwd_trial }}"
        database: spa
        roles:
          - { db: spa, role: trialRole }
        state: present
      no_log: true

    - name: Проба trialUser — чтение каталога услуг разрешено
      ansible.builtin.command:
        cmd: >-
          mongosh --quiet --eval
          'const c = JSON.parse(process.env.PROBE);
           try {
             const conn = new Mongo(`mongodb://${encodeURIComponent(c.user)}:${encodeURIComponent(c.password)}@127.0.0.1:27017/spa?authSource=spa`);
             conn.getDB("spa").services.findOne();
             print("ALLOWED");
           } catch (e) {
             print(e.code === 13 ? "DENIED" : "ERR:" + e.code);
           }'
      environment:
        PROBE: "{{ { 'user': 'trialUser', 'password': pwd_trial } | to_json }}"
      register: trial_find
      changed_when: false

    - name: trialUser читает услуги
      ansible.builtin.assert:
        that:
          - (trial_find.stdout | trim) == 'ALLOWED'
        success_msg: "trialUser создан и читает services ✓"

    - name: Удаление временного пользователя
      community.mongodb.mongodb_user:
        name: trialUser
        database: spa
        state: absent

    - name: Удаление временной роли
      community.mongodb.mongodb_role:
        name: trialRole
        db: spa
        state: absent

    - name: Проверка отсутствия trialUser и trialRole
      ansible.builtin.command:
        cmd: >-
          mongosh --quiet --eval
          'const c = JSON.parse(process.env.ADMIN_CREDS);
           const conn = new Mongo(`mongodb://${encodeURIComponent(c.user)}:${encodeURIComponent(c.password)}@127.0.0.1:27017/?authSource=admin`);
           const d = conn.getDB("spa");
           print("user=" + (d.getUser("trialUser") === null ? "absent" : "present") +
                 " role=" + (d.getRole("trialRole") === null ? "absent" : "present"));'
      environment:
        ADMIN_CREDS: "{{ { 'user': 'spaAdmin', 'password': mongo_admin_password } | to_json }}"
      register: trial_absent
      changed_when: false

    - name: Временные объекты удалены
      ansible.builtin.assert:
        that:
          - "'user=absent' in trial_absent.stdout"
          - "'role=absent' in trial_absent.stdout"
        success_msg: "trialUser и trialRole удалены ({{ trial_absent.stdout | trim }}) ✓"
        fail_msg: "Неожиданное состояние: {{ trial_absent.stdout | trim }}"
  tags: [rbac-trial]
