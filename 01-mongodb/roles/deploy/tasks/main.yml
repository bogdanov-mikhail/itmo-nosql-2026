---
- name: Базовые пакеты для репозитория и venv
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - python3-debian
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Официальный apt-репозиторий MongoDB (deb822)
  ansible.builtin.deb822_repository:
    name: mongodb-org-{{ mongo_version }}
    types: deb
    uris: https://repo.mongodb.org/apt/ubuntu
    suites: noble/mongodb-org/{{ mongo_version }}
    components: multiverse
    signed_by: https://www.mongodb.org/static/pgp/server-{{ mongo_version }}.asc
    enabled: true
    state: present
  register: mongo_repo

- name: Установка MongoDB
  ansible.builtin.apt:
    name: "{{ mongo_packages }}"
    state: present
    update_cache: "{{ mongo_repo is changed }}"

- name: Venv с pymongo 4 для коллекции community.mongodb
  ansible.builtin.command:
    cmd: python3 -m venv {{ venv_dir }}
    creates: "{{ venv_dir }}/bin/python3"

- name: pymongo в venv
  ansible.builtin.pip:
    name: "pymongo>=4,<5"
    virtualenv: "{{ venv_dir }}"
    state: present

- name: Конфигурация mongod
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    mode: "0644"
  notify: Перезапустить mongod

- name: Служба mongod — запущена и в автозапуске
  ansible.builtin.systemd:
    name: mongod
    state: started
    enabled: true

- name: Применить отложенные обработчики
  ansible.builtin.meta: flush_handlers

- name: Ожидание открытия порта mongod
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ mongo_port }}"
    delay: 2
    timeout: 60

- name: Health-check — ping через mongosh
  ansible.builtin.command:
    cmd: "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
  register: mongo_ping
  changed_when: false

- name: Health-check — сверка результата
  ansible.builtin.assert:
    that:
      - mongo_ping.stdout | trim == '1'
    success_msg: "MongoDB доступна: ping ok=1"
    fail_msg: "MongoDB не ответила на ping: {{ mongo_ping.stdout }}"
