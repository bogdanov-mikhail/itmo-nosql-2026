---
- name: Перезапустить mongodb-exporter
  ansible.builtin.systemd:
    name: mongodb-exporter
    state: restarted
    daemon_reload: true

- name: Перезапустить prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Перезапустить grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
    daemon_reload: true
